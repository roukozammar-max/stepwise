name: CI

on: [push, pull_request]

jobs:
  verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Eval (fails if any wrong step is marked correct)
        run: python eval.py
